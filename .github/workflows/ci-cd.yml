 # Full CI/CD pipeline for Node + React + Security + Deployment artifact verification
 name: CI/CD

 on:
   push:
     branches: ["**"]
   pull_request:
     branches: ["**"]

 permissions:
   contents: read

 jobs:
   build:
     name: Build (backend + frontend)
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       # --- Node toolchain (JS/TS) ---
       - uses: actions/setup-node@v4
         with:
           node-version: "20"
           cache: "npm"

       # Backend install
       - name: Install backend deps
         run: |
           npm ci
           # if backend is in a subfolder, cd there first

       # Frontend install (if present)
       - name: Install frontend deps
         if: hashFiles('frontend/package.json') != ''
         working-directory: frontend
         run: |
           echo "CLEAN INSTALL: frontend"
           echo "PWD: $(pwd)"
           echo "Removing node_modules (if any) and clearing npm cache"
           rm -rf node_modules
           npm cache clean --force || true
           echo "Attempting strict install (npm ci), fallback to npm install if needed"
           npm ci || npm install

       # Optional Python toolchain for pylint/bandit if repo has Python
       - uses: actions/setup-python@v5
         if: hashFiles('**/requirements.txt') != ''
         with:
           python-version: "3.11"

       - name: Install Python deps
         if: hashFiles('**/requirements.txt') != ''
         run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt

   test:
     name: Test (unit + integration + system)
     needs: build
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-node@v4
         with:
           node-version: "20"
           cache: "npm"

       - name: Debug install environment (backend)
         run: |
           echo "PWD: $(pwd)"
           echo "--- listing workspace root ---"
           ls -la
           echo "node/npm versions:"; node -v; npm -v
           if [ -f package.json ]; then echo "package.json present:"; head -n 50 package.json; fi
           if [ -f package-lock.json ]; then echo "package-lock.json contains 'yaml' lines:"; grep -n '"yaml"' package-lock.json || true; fi
           echo "--- end debug ---"
       - name: Install backend deps
         run: npm ci
       - name: Install frontend deps
         if: hashFiles('frontend/package.json') != ''
         working-directory: frontend
         run: |
           rm -rf node_modules
           npm cache clean --force || true
           npm ci || npm install

       # Spin up a MongoDB for API tests if you need one
       - name: Start MongoDB
         uses: supercharge/mongodb-github-action@v1
         with:
           mongodb-version: '6.0'

       # Backend tests (Jest) with JUnit output
       - name: Run backend tests
         env:
           MONGODB_URI: mongodb://localhost:27017/ci_test
           NODE_ENV: test
         run: |
           npm run test:ci

       # Frontend tests (CRA) with coverage + JUnit
       - name: Run frontend tests
         if: hashFiles('frontend/package.json') != ''
         working-directory: frontend
         env:
           CI: "true"
         run: npm run test:ci

       - name: Upload test results
         uses: actions/upload-artifact@v4
         with:
           name: test-results
           path: |
             reports/junit/**/*.xml
             frontend/reports/junit/**/*.xml
           if-no-files-found: ignore

   coverage:
     name: Coverage (≥ 75% gate)
     needs: test
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-node@v4
         with:
           node-version: "20"
           cache: "npm"
       - name: Install backend deps
         run: npm ci
       - name: Install frontend deps
         if: hashFiles('frontend/package.json') != ''
         working-directory: frontend
         run: |
           rm -rf node_modules
           npm cache clean --force || true
           npm ci || npm install

       # Ensure a MongoDB is available for backend coverage (coverage job previously attempted to start
       # mongodb-memory-server which fails on newer runners due to missing libcrypto.so.1.1).
       - name: Start MongoDB for coverage
         uses: supercharge/mongodb-github-action@v1
         with:
           mongodb-version: '6.0'

       - name: Generate backend coverage (NYC)
         env:
           MONGODB_URI: mongodb://localhost:27017/ci_test
         run: npm run coverage:backend

       - name: Generate frontend coverage (CRA)
         if: hashFiles('frontend/package.json') != ''
         working-directory: frontend
         env:
           CI: "true"
         run: npm run coverage

       - name: Enforce combined threshold 75%
         shell: bash
         run: |
           echo "--- debug: coverage directories ---"
           ls -la coverage || true
           ls -la frontend/coverage || true
           echo "--- debug: coverage/coverage-summary.json (if present) ---"
           if [ -f coverage/coverage-summary.json ]; then head -n 200 coverage/coverage-summary.json; else echo "no backend summary"; fi
           echo "--- debug: frontend/coverage/coverage-summary.json (if present) ---"
           if [ -f frontend/coverage/coverage-summary.json ]; then head -n 200 frontend/coverage/coverage-summary.json; else echo "no frontend summary"; fi
           echo "--- running threshold check ---"
           node scripts/check-coverage-threshold.mjs 75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            frontend/coverage/
            reports/coverage-summary.json
          if-no-files-found: error

   lint:
     name: Lint (pylint ≥7.5, ESLint 0 errors <10 warnings)
     needs: coverage
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-node@v4
         with:
           node-version: "20"
           cache: "npm"
       - name: Install backend deps
         run: npm ci
       - name: Install frontend deps
         if: hashFiles('frontend/package.json') != ''
         working-directory: frontend
         run: |
           rm -rf node_modules
           npm cache clean --force || true
           npm ci || npm install

       - uses: actions/setup-python@v5
         if: hashFiles('**/*.py') != ''
         with:
           python-version: "3.11"
       - name: Install Python linters
         if: hashFiles('**/*.py') != ''
         run: |
           python -m pip install --upgrade pip
           pip install pylint

       - name: Run ESLint (JSON report)
         run: npm run lint:ci

       - name: Run pylint with score gate
         if: hashFiles('**/*.py') != ''
         run: |
           pylint $(git ls-files '*.py') --output-format=text | tee reports/pylint.txt
           python scripts/enforce-pylint-threshold.py reports/pylint.txt 7.5

       - name: Upload lint reports
         uses: actions/upload-artifact@v4
         with:
           name: lint-report
           path: |
             reports/eslint.json
             reports/eslint-summary.txt
             reports/pylint.txt
           if-no-files-found: ignore

   security:
     name: Security (Bandit/Safety/npm audit/Secrets)
     needs: lint
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       # JavaScript dependency & code scan
       - uses: actions/setup-node@v4
         with:
           node-version: "20"
           cache: "npm"
       - name: Install deps
         run: npm ci
       - name: npm audit (high+)
         run: |
           npm audit --audit-level=high --json | tee reports/npm-audit.json
           node scripts/fail-on-npm-audit.mjs reports/npm-audit.json

       # Python security (optional)
       - uses: actions/setup-python@v5
         if: hashFiles('**/requirements.txt') != ''
         with:
           python-version: "3.11"
       - name: Bandit (code)
         if: hashFiles('**/*.py') != ''
         run: |
           pip install bandit
           bandit -r . -f json -o reports/bandit.json || true
       - name: Safety (deps)
         if: hashFiles('**/requirements.txt') != ''
         run: |
           pip install safety
           safety check -r requirements.txt --output json > reports/safety.json || true

       # Secret scanning
       - name: truffleHog (secrets)
         uses: trufflesecurity/trufflehog@v3.81.10
         with:
           path: .
           json: true
           allow: true
           redact: true
       - name: Save truffleHog report
         shell: bash
         run: |
           mkdir -p reports
           # action prints to stdout; capture from previous step if needed
           echo "See job logs for redacted findings" > reports/trufflehog.txt

       - name: Upload security reports
         uses: actions/upload-artifact@v4
         with:
           name: security-report
           path: |
             reports/npm-audit.json
             reports/bandit.json
             reports/safety.json
             reports/trufflehog.txt
           if-no-files-found: ignore

   deploy:
     name: Create deployment artifact (.zip)
     needs: security
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       - name: Download CI artifacts
         uses: actions/download-artifact@v4
         with:
           path: artifacts/

       - name: Setup Node for frontend
         if: hashFiles('frontend/package.json') != ''
         uses: actions/setup-node@v4
         with:
           node-version: "20"

       - name: Build production assets (frontend)
         if: hashFiles('frontend/package.json') != ''
         run: |
           cd frontend
           rm -rf node_modules
           npm cache clean --force || true
           npm ci || npm install
           npm run build
           cd ..

       - name: Assemble deployment directory
         shell: bash
         run: |
           set -e
           mkdir -p deployment/reports
           # include source code (backend + frontend)
           rsync -a --exclude 'node_modules' --exclude '.git' ./ deployment/src/
           # include compiled frontend build if present
           if [ -d "frontend/build" ]; then
             rsync -a frontend/build/ deployment/src/frontend_build/
           fi
           # include reports
           rsync -a artifacts/ deployment/reports/
           # include essentials
           cp -f README.md deployment/
           [ -f package.json ] && cp -f package.json deployment/
           [ -f requirements.txt ] && cp -f requirements.txt deployment/
           # optional: docs
           [ -d docs ] && rsync -a docs/ deployment/docs/

       - name: Zip deployment package
         run: |
           cd deployment
           zip -r ../deployment-package-$(date +%Y%m%d).zip .
           cd ..
           ls -lh deployment-package-*.zip

       - name: Upload deployment artifact
         uses: actions/upload-artifact@v4
         with:
           name: deployment-package
           path: deployment-package-*.zip
           retention-days: 30

   verify_artifact:
     name: Verify artifact contents
     needs: deploy
     runs-on: ubuntu-latest
     steps:
       - name: Download deployment artifact
         uses: actions/download-artifact@v4
         with:
           name: deployment-package
           path: .
       - name: Inspect zip
         run: |
           unzip -l deployment-package-*.zip | tee zip-contents.txt
           unzip -q deployment-package-*.zip -d extracted
           test -d extracted/src || (echo "❌ source missing" && exit 1)
           test -f extracted/README.md || (echo "❌ README missing" && exit 1)
           # reports from earlier stages
           test -d extracted/reports || (echo "❌ reports folder missing" && exit 1)
           # check representative reports exist
           (ls extracted/reports/*/coverage* >/dev/null 2>&1 || ls extracted/reports/**/coverage* >/dev/null 2>&1) || echo "⚠️ coverage report not found"
           (ls extracted/reports/*/eslint* >/dev/null 2>&1 || ls extracted/reports/**/eslint* >/dev/null 2>&1) || echo "⚠️ eslint report not found"
           (ls extracted/reports/*/npm-audit.json >/dev/null 2>&1 || true)
           echo "✅ artifact structure OK"
